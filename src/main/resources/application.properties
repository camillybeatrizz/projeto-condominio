spring.application.name=Kondo
spring.jpa.open-in-view=false

# Security should fail closed by default outside the local profile.
# Use the local profile or explicitly set KONDO_SECURITY_ENABLED=false only for local study scenarios.
kondo.security.enabled=${KONDO_SECURITY_ENABLED:true}
kondo.security.allow-insecure-open-access=${KONDO_SECURITY_ALLOW_INSECURE_OPEN_ACCESS:false}
kondo.security.client-id=${KONDO_OIDC_CLIENT_ID:kondo-api}
# The canonical authenticated identity is the OIDC subject (`sub`), linked to
# `usuario.externalId`. The principal claim is only an auxiliary identifier for
# display or compatibility scenarios and should not replace externalId.
kondo.security.principal-claim=${KONDO_OIDC_PRINCIPAL_CLAIM:email}
kondo.security.audiences=${KONDO_OIDC_AUDIENCES:${KONDO_OIDC_CLIENT_ID:kondo-api}}
kondo.security.strict-external-identity=${KONDO_OIDC_STRICT_EXTERNAL_IDENTITY:false}
kondo.integrations.asaas.enabled=${KONDO_ASAAS_ENABLED:false}
kondo.integrations.asaas.api-key=${KONDO_ASAAS_API_KEY:}
kondo.integrations.asaas.base-url=${KONDO_ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
kondo.integrations.asaas.webhook.access-token=${KONDO_ASAAS_WEBHOOK_ACCESS_TOKEN:}
kondo.integrations.asaas.webhook.allow-legacy-access-token=${KONDO_ASAAS_WEBHOOK_ALLOW_LEGACY_ACCESS_TOKEN:false}
kondo.integrations.asaas.webhook.hmac-secret=${KONDO_ASAAS_WEBHOOK_HMAC_SECRET:}
kondo.integrations.asaas.webhook.signature-header=${KONDO_ASAAS_WEBHOOK_SIGNATURE_HEADER:asaas-signature}
kondo.integrations.asaas.webhook.timestamp-header=${KONDO_ASAAS_WEBHOOK_TIMESTAMP_HEADER:asaas-timestamp}
kondo.integrations.asaas.webhook.allowed-timestamp-skew-seconds=${KONDO_ASAAS_WEBHOOK_ALLOWED_TIMESTAMP_SKEW_SECONDS:300}

# Vault-friendly config import. In Kubernetes, Vault Agent/CSI can mount this file.
spring.config.import=optional:file:/vault/secrets/kondo.properties

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.oauth.client-id=${KONDO_OIDC_CLIENT_ID:kondo-api}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

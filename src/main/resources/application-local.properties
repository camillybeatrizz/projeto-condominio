# Activate with: SPRING_PROFILES_ACTIVE=local
#
# Local profile for running the API and Swagger without an external database.

spring.datasource.url=jdbc:h2:mem:kondo_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Security stays disabled locally unless explicitly enabled via env var.
kondo.security.enabled=false
kondo.security.allow-insecure-open-access=true

# Activate with: SPRING_PROFILES_ACTIVE=vault
#
# This profile assumes Vault injects secrets as env vars or into:
# /vault/secrets/kondo.properties
#
# Example secret file contents:
# spring.datasource.url=jdbc:postgresql://postgres:5432/kondo
# spring.datasource.username=kondo
# spring.datasource.password=super-secret
# KONDO_OIDC_ISSUER_URI=https://keycloak.example.com/realms/kondo
#
# The app itself does not need a Vault SDK for this mode. Vault remains an infra concern.

spring.datasource.url=${KONDO_DB_URL:jdbc:postgresql://localhost:5432/kondo}
spring.datasource.username=${KONDO_DB_USERNAME:kondo}
spring.datasource.password=${KONDO_DB_PASSWORD:kondo}
